<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Бюджет</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, system-ui, sans-serif; background: #f4f4f1; color: #1c1b19; text-align: center; padding: 24px; box-sizing: border-box; }
      @media (prefers-color-scheme: dark) { body { background: #111110; color: #f1f0ec; } p { color: #a3a09a; } }
      p { color: #6b6862; max-width: 22rem; line-height: 1.45; margin: 12px auto; }
      button { margin-top: 12px; height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #3f51d9; color: #fff; font-size: 16px; }
      small { display: block; margin-top: 16px; color: #8a867f; }
    </style>
    <script src="config.js"></script>
  </head>
  <body>
    <main>
      <h1>Нет связи с сервером</h1>
      <p>Приложение работает через сервер на вашем компьютере. Проверьте, что компьютер включён, сервер запущен, а телефон подключён к той же сети Wi-Fi.</p>
      <button type="button" id="retry">Повторить</button>
      <small id="status"></small>
    </main>
    <script>
      // Адрес сервера прописывает npm run ios:sync (config.js). Перезагрузка этой страницы ничего бы не дала:
      // она открыта из приложения, а не с сервера.
      (function () {
        var url = window.SERVER_URL;
        var status = document.getElementById("status");
        var busy = false;
        function retry(manual) {
          if (!url || busy) return;
          busy = true;
          if (manual) status.textContent = "Подключаемся…";
          fetch(url, { cache: "no-store", mode: "no-cors" })
            .then(function () { location.replace(url); })
            .catch(function () { if (manual) status.textContent = "Сервер пока недоступен."; })
            .finally(function () { busy = false; });
        }
        document.getElementById("retry").addEventListener("click", function () { retry(true); });
        window.addEventListener("online", function () { retry(false); });
        setInterval(function () { retry(false); }, 5000);
        if (!url) status.textContent = "Адрес сервера не задан — выполните npm run ios:sync.";
      })();
    </script>
  </body>
</html>
